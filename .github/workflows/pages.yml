# Seite auf GitHub Pages: Bei jedem Push auf main testen, bauen und veröffentlichen.
# Adresse: https://<github-name>.github.io/<repository>/
# Einmalig einrichten: Settings → Pages → Source «GitHub Actions»;
# Settings → Secrets and variables → Actions → Variables: ZUERIPOLY_SERVER_URL = Adresse des Spielservers auf Render.
name: Seite auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur eine Veröffentlichung gleichzeitig; eine laufende wird fertig gemacht.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Seite bauen
        run: npm run build
        env:
          # Projektseite liegt unter /<repository>/, z. B. /zueripoly/
          ZUERIPOLY_BASE: /${{ github.event.repository.name }}/
          # Spielserver auf Render (leer: Online-Spiel geht auf Pages nicht, Solo und Lokal schon)
          VITE_ZUERIPOLY_SERVER: ${{ vars.ZUERIPOLY_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
